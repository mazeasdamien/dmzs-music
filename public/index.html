<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/icon-192.png" type="image/png">
<title>dmzs-music</title>
<style>
/* ─── design tokens ──────────────────────────────────────── */
/* One palette. The app is dark, full stop.
   The tokens below stayed as variables after the light theme was dropped:
   the mini player, sheets and toast all reference them, and collapsing them
   back into literals would only make those rules harder to read. */
:root{
  --bg:#09090b; --elev:#141417; --elev2:#1d1d21;
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.13);
  --t1:#f4f4f5; --t2:#8b8b93; --t3:#56565e;
  --acc:#f0a04b; --red:#f2615c; --on-acc:#1a1206;
  --press:rgba(255,255,255,.045); --press2:#2a2a30;
  --track:rgba(255,255,255,.09); --grab:rgba(255,255,255,.2);
  --glass:rgba(24,24,28,.97); --sheet:#17171b; --input:#0e0e11;
  --toast-bg:rgba(240,240,245,.96); --toast-fg:#101014;
  --shadow:rgba(0,0,0,.4);
  --r:7px; --row:62px; --mini:60px;
  --minipad:clamp(6px, var(--sab), 18px);
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}


*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--t1);
  font:400 15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
/* Almost everything here sets its own display, and every one of those rules
   beats the browser's [hidden]{display:none}. An element hidden from script
   then stays on screen and, worse, stays clickable. One !important at the top
   is cheaper than remembering the escape hatch on each new rule. */
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
input{font:inherit;color:inherit;background:none;border:0;outline:0;user-select:text;-webkit-user-select:text}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#app{height:100%;display:flex;flex-direction:column}
header{flex:none;padding:calc(var(--sat) + 14px) 16px 0;background:var(--bg)}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:27px;font-weight:700;letter-spacing:-.021em;line-height:1.1}
.meta{font-size:12.5px;color:var(--t3);margin-top:3px}
.iconbtn{width:33px;height:33px;border-radius:50%;flex:none;background:var(--elev2);color:var(--t1);transition:background .12s,transform .08s}
.iconbtn:active{background:var(--press2);transform:scale(.93)}

.actions{display:flex;gap:8px;margin:14px 0 10px}
/* min-width:0 is load bearing: without it, "Play" and "Shuffle" refuse to
   shrink below their text width and push the next button off screen. */
.act{flex:1;min-width:0;height:40px;border-radius:var(--r);gap:7px;background:var(--elev);border:1px solid var(--line);font-size:14.5px;font-weight:500;letter-spacing:-.005em;transition:background .12s,transform .08s}
.act:active{background:var(--elev2);transform:scale(.985)}
.act svg{opacity:.9}

/* "Download everything" is a round button like the others now. The count
   rides in a badge, since a 33px circle has no room for "12/40" inline. */
.iconbtn{position:relative}
#dlAll.done{color:var(--t3)}
#dlAll.run{color:var(--acc)}
.badge{
  position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--acc);color:var(--on-acc);
  font-size:9.5px;font-weight:700;line-height:16px;text-align:center;
  font-variant-numeric:tabular-nums;
}

/* A starred track shows its heart in the row, in the accent colour. */
.favmark{color:var(--acc);display:inline-flex;flex:none}

/* Play counter, hidden until the track has actually been played. */
.plays{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--t3);flex:none}
.plays svg{opacity:.75}

/* Podcasts. A finished episode reads as done rather than disappearing; a
   half-listened one carries its progress under the row, the way a busy
   track carries its download. */
.row.done .ttl{color:var(--t3)}
.row.done .art{opacity:.6}
.addrow{color:var(--acc)}
.addrow .ttl{color:var(--acc);font-weight:500}
.addrow svg{color:var(--acc)}
/* Playback speed, episodes only. Lives in the player header where the
   layout already reserved a slot; hidden for tracks, which play at 1×. */
#npRate{visibility:hidden;font-size:11px;font-weight:700;letter-spacing:.01em;background:rgba(255,255,255,.1)}
#npRate.show{visibility:visible}

/* The "Auto" switch: every new track goes to the device on its own. */
.metarow{display:flex;align-items:center;flex-wrap:wrap;gap:5px 7px;margin-top:3px}
.htools{display:flex;align-items:center;gap:8px;flex:none}
.autopill{height:18px;padding:0 7px;border-radius:9px;flex:none;background:var(--elev2);
  color:var(--t3);border:1px solid var(--line);font-size:10.5px;font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;transition:background .12s,color .12s}
.autopill[aria-pressed="true"],.autopill.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}

.search[hidden]{display:none}
.search{display:flex;align-items:center;gap:7px;height:33px;padding:0 9px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.search svg{color:var(--t3);flex:none}
.search input{flex:1;font-size:14px;min-width:0}
.search input::placeholder{color:var(--t3)}
.clr{display:none;width:17px;height:17px;border-radius:50%;background:var(--t3);color:var(--bg);flex:none}
.search.has .clr{display:flex}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list{padding:2px 0 0}
#pad{height:calc(var(--mini) + var(--minipad) + 18px)}

/* pan-y hands vertical scrolling back to the browser and keeps the
   horizontal axis for the star gesture. Without it the list would try to
   scroll and the swipe would never get its move events. */
.row{display:flex;align-items:center;gap:11px;height:var(--row);padding:0 16px;position:relative;transition:background .1s;touch-action:pan-y}
/* Both directions get the same weight of feedback. The remove side used to
   be var(--press), white at 4.5%, which read as nothing happening at all. */
.row.sw-on{background:color-mix(in srgb, var(--acc) 20%, transparent)}
.row.sw-off{background:color-mix(in srgb, var(--red) 20%, transparent)}
.row.sw-on .ttl{color:var(--acc)}
.row.sw-off .ttl{color:var(--red)}
.row:active{background:var(--press)}
.row::after{content:"";position:absolute;left:73px;right:0;bottom:0;height:1px;background:var(--line)}
.row:last-child::after{display:none}

.art{width:46px;height:46px;border-radius:5px;flex:none;position:relative;overflow:hidden;background:var(--elev2)}
.art img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:rgba(255,255,255,.45)}
.npart .fb{font-size:84px;font-weight:500}

.info{flex:1;min-width:0}
.ttl{font-size:14.5px;font-weight:500;letter-spacing:-.007em;line-height:1.25}
.art2{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.25}
.right{display:flex;align-items:center;gap:11px;flex:none}
.dur{font-size:12.5px;color:var(--t3)}
.off{color:var(--t3);opacity:.55}
.off.on{color:var(--t1);opacity:.75}
.dots{width:24px;height:34px;color:var(--t3)}
.dots:active{color:var(--t1)}

.row.cur .ttl{color:var(--acc)}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px;width:13px}
.eq i{width:2.5px;background:var(--acc);border-radius:1px;height:30%}
.playing .eq i:nth-child(1){animation:b .78s ease-in-out infinite alternate}
.playing .eq i:nth-child(2){animation:b .58s .16s ease-in-out infinite alternate}
.playing .eq i:nth-child(3){animation:b .92s .07s ease-in-out infinite alternate}
@keyframes b{from{height:22%}to{height:100%}}

/* work-in-progress states */
.row.busy .art2{color:var(--acc)}
.row.err .art2{color:var(--red)}
.pct{font-size:12.5px;color:var(--acc)}
.rowbar{position:absolute;left:73px;right:16px;bottom:0;height:2px;background:var(--track);overflow:hidden}
.rowbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease-out}
.row.busy .art{opacity:.55}
.row.err .art{opacity:.4}

.empty{padding:60px 34px;text-align:center;color:var(--t3);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--t2);font-weight:500;margin-bottom:5px}

/* Docked to the very bottom rather than floating 8px above it.
   env(safe-area-inset-bottom) is not a fixed number: in iOS Safari with
   viewport-fit=cover it swells to reserve the browser toolbar, which pushed
   the bar into the middle of the list. Anchoring at 0 and moving that inset
   into the padding means the surface always reaches the screen edge, whatever
   the browser reports.

   --sbw is the width of the list's scrollbar, measured at runtime, so the bar
   stops short of it on desktop instead of covering it. */
#mini{
  position:fixed;left:0;right:var(--sbw, 0px);bottom:0;
  height:calc(var(--mini) + var(--minipad));overflow:hidden;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line-strong);
  display:flex;align-items:center;gap:10px;padding:0 14px var(--minipad);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:20;
  /* Whatever the browser decides bottom:0 means, anything left below the bar
     is painted in the bar own colour. On iOS that strip varies with the
     browser chrome and the home indicator, and chasing its height is a losing
     game; continuing the surface into it costs nothing and always looks
     right. The shadow falls outside the viewport when there is no strip. */
  box-shadow:0 60px 0 0 var(--glass);
  /* The bar owns every gesture that starts on it: the top strip is a
     scrubber, and nothing here scrolls. Without this, iOS claims a sideways
     drag for its own navigation and cancels the pointer mid-seek. */
  touch-action:none;
}
#mini.up{transform:translateY(0)}
/* The rail behind the progress line, so the timeline reads as a full width
   thing that can be dragged rather than an orange stub. */
#mini::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--track)}
#mini .art{width:42px;height:42px;border-radius:4px}
#mini .ttl{font-size:13.5px}
#mini .art2{font-size:11.5px;margin-top:1px}
.mctl{display:flex;align-items:center;gap:2px;flex:none}
.mbtn{width:38px;height:44px;color:var(--t1)}
/* Starring from the bar matters on desktop, where there is no row to swipe. */
#mFav{color:var(--t3)}
#mFav.on{color:var(--acc)}
.mbtn:active{opacity:.5}
/* Progress line and scrubber in one. It stays 2px at rest, so it reads as a
   status and not as a control, and thickens under the thumb. The width
   transition is what smooths the once-a-second timeupdate; during a drag it
   would lag behind the finger, hence the override. */
#mprog{position:absolute;left:0;top:0;height:2px;background:var(--acc);width:0;transition:width .25s linear,height .12s}
#mini.seek #mprog{height:5px;transition:height .12s}

#np{
  position:fixed;inset:0;z-index:40;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  padding:calc(var(--sat) + 6px) 26px calc(var(--sab) + 18px);
  transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  will-change:transform;pointer-events:none;
}
#np.up{transform:translateY(0);pointer-events:auto}
#npbg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;filter:blur(58px) saturate(1.5) brightness(.42);transform:scale(1.5);opacity:.85}
#npbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,11,.35),rgba(9,9,11,.9))}

.nphead{display:flex;align-items:center;justify-content:space-between;flex:none;height:38px;margin:0 -8px}
.nphead .lbl{font-size:11px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.nphead .iconbtn{background:rgba(255,255,255,.1)}

.npart{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px 0 8px}
.npart .box{width:min(100%,340px);aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--elev2);box-shadow:0 26px 60px -14px rgba(0,0,0,.75);position:relative;transition:transform .3s cubic-bezier(.32,.72,0,1)}
#np:not(.playing) .npart .box{transform:scale(.88)}
/* position:relative is required: .fb is position:absolute and would paint ON
   TOP of the image without it, so the artwork exists but stays hidden behind
   the fallback letter. Same reason as .art img above. */
.npart img{width:100%;height:100%;object-fit:cover;position:relative;display:block;transition:opacity .2s ease}

.npmeta{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:18px}
.npmeta h2{font-size:20px;font-weight:600;letter-spacing:-.017em;line-height:1.25}
.npmeta p{font-size:15px;color:rgba(255,255,255,.6);margin-top:3px}
/* Offline state as a quiet line above the scrubber, rather than an amber
   button that read as an action when it was only ever a status. */
.npstate{flex:none;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:rgba(255,255,255,.4)}
.npbtns{display:flex;align-items:center;gap:9px;flex:none}
.dlbtn{width:32px;height:32px;border-radius:50%;flex:none;margin-bottom:3px;background:rgba(255,255,255,.1);color:#fff}
.dlbtn.on{background:var(--acc);color:var(--on-acc)}
#npFav.on{background:var(--acc);color:var(--on-acc)}
.dlbtn.wait{opacity:.5}

.scrub{flex:none;margin-top:20px;padding:9px 0;cursor:pointer}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.16);position:relative}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:rgba(255,255,255,.85);width:0}
.bar span::after{content:"";position:absolute;right:-5px;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;transform:translateY(-50%) scale(0);transition:transform .16s}
.scrub:active .bar span::after{transform:translateY(-50%) scale(1)}
.times{display:flex;justify-content:space-between;margin-top:7px;font-size:11.5px;color:rgba(255,255,255,.45)}

.transport{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tbtn{width:52px;height:52px;color:var(--t1);transition:opacity .1s,transform .08s}
.tbtn:active{opacity:.45;transform:scale(.9)}
.tbtn.sm{width:44px;height:44px;color:rgba(255,255,255,.5)}
.tbtn.sm.on{color:var(--acc)}
.tbtn.sm.on .dot{opacity:1}
.dot{opacity:0}
#npplay{width:66px;height:66px;border-radius:50%;background:#fff;color:#0a0a0c;transition:transform .09s}
#npplay:active{transform:scale(.92)}

#scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.up{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--sheet);border-radius:15px 15px 0 0;border-top:1px solid var(--line-strong);padding:8px 16px calc(var(--sab) + 14px);transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);touch-action:none}
/* The URL field still needs the browser gesture for caret placement. */
.sheet input{touch-action:auto}
.sheet.up{transform:translateY(0)}
.grab{width:35px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 14px;cursor:grab}
.sh-t{font-size:16px;font-weight:600;letter-spacing:-.011em;margin-bottom:3px}
.sh-s{font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.45}

.urlbox{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;background:var(--input);border:1px solid var(--line-strong);border-radius:var(--r)}
.urlbox input{flex:1;font-size:14.5px;min-width:0}
.urlbox input::placeholder{color:var(--t3)}
.paste{font-size:13px;font-weight:500;color:var(--acc);flex:none;padding:0 2px}
/* Note: do not name this class "err". It would collide with the .row.err
   modifier and hide the failed rows in the list. */
.formerr{display:none;font-size:13px;color:var(--red);margin-top:10px;line-height:1.45}
.formerr.show{display:block}

.cta{width:100%;height:46px;border-radius:var(--r);margin-top:16px;background:var(--acc);color:var(--on-acc);font-size:15px;font-weight:600;letter-spacing:-.006em;gap:8px;transition:opacity .12s,transform .08s}
.cta:active{transform:scale(.99);opacity:.85}
.cta:disabled{opacity:.28;pointer-events:none}
.spin{width:15px;height:15px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.2);border-top-color:var(--on-acc);animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.mi{display:flex;align-items:center;gap:13px;height:50px;font-size:15px;letter-spacing:-.008em;width:100%;justify-content:flex-start;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}
.mi svg{color:var(--t2);flex:none}
.mi:active{opacity:.5}
.mi.del{color:var(--red)}
.mi.del svg{color:var(--red)}
.mi[hidden]{display:none}

#toast{position:fixed;left:50%;bottom:calc(var(--mini) + var(--minipad) + 26px);transform:translate(-50%,14px);z-index:80;background:var(--toast-bg);color:var(--toast-fg);padding:9px 15px;border-radius:19px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 8px 26px var(--shadow);max-width:82vw;text-align:center}
#toast.up{opacity:1;transform:translate(-50%,0)}

/* ─── portrait lock ───────────────────────────────────────────
   iOS ignores the manifest's "orientation" field for a pinned app, and
   screen.orientation.lock() does not exist in Safari. The only lock that
   holds on the web is refusing to render the interface in landscape.

   The max-height guard only targets phones lying flat: a desktop window is
   landscape too, and has no reason to be blocked. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  #app,#mini,#np,#scrim,.sheet,#toast{display:none!important}
  #rotate{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;
    background:var(--bg);text-align:center;color:var(--t2);font-size:13.5px;line-height:1.5;
  }
  #rotate svg{color:var(--t3)}
  #rotate b{display:block;color:var(--t1);font-size:16px;font-weight:600;margin-bottom:4px}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="htop">
      <div style="min-width:0">
        <div class="metarow">
          <span class="meta" id="hmeta">Loading…</span>
          <button class="autopill" id="sortBtn" title="Order of the library, and of playback">Recent</button>
          <button class="autopill" id="favBtn" title="Show and play only starred tracks">Favourites</button>
          <button class="autopill" id="mixBtn" title="Tracks over ten minutes, kept out of the library">Mixes</button>
          <button class="autopill" id="podBtn" title="Podcast subscriptions">Podcasts</button>
        </div>
      </div>
      <div class="htools">
        <button class="iconbtn" id="dlAll" aria-label="Download everything to this device"></button>
        <button class="iconbtn" id="searchBtn" aria-label="Search" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        </button>
      </div>
    </div>
    <div class="actions">
      <button class="act" id="shufAll">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle
      </button>
    </div>
    <div class="search" id="searchWrap" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clr" id="qclr" aria-label="Clear">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>
  <main id="main"><div id="list"></div><div id="pad"></div></main>
</div>

<div id="mini">
  <div id="mprog"></div>
  <div class="art" id="mArt"></div>

  <p><b>Rotate your device</b>This app is designed for portrait.</p>

<script>
"use strict";

/* ═══ constants ════════════════════════════════════════════ */
const MEDIA_CACHE = "dmzs-media-v1";
// Tracks and podcast episodes share the player, the offline cache and most
// of the UI; the URL shape is where they differ, so it is decided in
// exactly one place. Episode art is the show's cover.
const mediaURL = (id) => (epById(id) ? `/media/ep/${id}` : `/media/${id}`);
const artURL   = (id) => { const e = epById(id); return e ? `/art/pod/${e.pod}` : `/art/${id}`; };

const ICON_PLAY  = `<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>`;
const ICON_PAUSE = `<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.3"/><rect x="14" y="4.5" width="4" height="15" rx="1.3"/></svg>`;
const ICON_PLAY_L  = `<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>`;
const ICON_PAUSE_L = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.3"/><rect x="14" y="4.5" width="4" height="15" rx="1.3"/></svg>`;

/* ═══ state ════════════════════════════════════════════════ */
let tracks = [];
let offline = new Set();          // ids available offline
let queue = [], qi = -1;
let queueSrc = "Library";         // where the current queue was built from
let shuffle = false, repeat = 0;  // 0 off · 1 playlist · 2 track
let pollTimer = null;
let objectURL = null;             // current blob: URL, to be revoked

/* Podcasts */
let pods = [], eps = [];
let podMode = localStorage.getItem("dmzs_podmode") === "1";
let curPod = null;                // open show, or null for the shows list
let podTimer = null;
let podsLoaded = false;
let podRate = Number(localStorage.getItem("dmzs_rate")) || 1;
const PODS_KEY = "dmzs_pods_cache";
const epById = (id) => eps.find((e) => e.id === id);
const isEp = (t) => Boolean(t && t.pod);

const REP = ["off", "all", "one"];
const $ = (s) => document.querySelector(s);

/* ═══ audio ════════════════════════════════════════════════ */
// ONE element, created once. The first play() comes from a real user gesture;
// the element then stays "blessed", and later src changes go through, the
// `ended` event included.
// (Web Audio would be a trap: its AudioContext is suspended in the background
//  on iOS, which would kill lock-screen playback.)
const audio = new Audio();
audio.preload = "metadata";
audio.setAttribute("playsinline", "");

/* ═══ helpers ══════════════════════════════════════════════ */
const mmss = (s) => {
  s = Math.max(0, Math.round(Number(s) || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const esc = (s) =>
  String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const fmtSize = (b) => {
  if (!b) return "—";
  const mo = b / 1048576;
  return mo < 1000 ? mo.toFixed(1).replace(".", ",") + " Mo" : (mo / 1024).toFixed(1).replace(".", ",") + " Go";
};
const byId = (id) => tracks.find((t) => t.id === id) || epById(id);

function artHTML(t) {
  if (!t) return "";
  const h = hue(t.title + t.artist);
  // Uppercase first, escape second: the other way round would produce "&LT;"
  // for a title starting with "<".
  const letter = esc(((t.title || "?").trim()[0] || "?").toUpperCase());
  // An episode shows its show's cover whatever its own status: the art
  // exists as soon as the subscription does.
  return `<div class="fb" style="background:linear-gradient(145deg,hsl(${h} 34% 30%),hsl(${(h + 42) % 360} 30% 15%))">${letter}</div>` +
         (t.status === "ready" || isEp(t) ? `<img src="${artURL(t.id)}" alt="" loading="lazy" onerror="this.remove()">` : "");
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("up");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("up"), 2400);
}

/* ═══ API ══════════════════════════════════════════════════ */
async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  if (res.status === 401) {
    document.body.innerHTML =
      `<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#8b8b93">
         <div><strong style="display:block;color:#f4f4f5;font-size:17px;margin-bottom:6px">Session expired</strong>
         Open your activation link again.</div></div>`;
    throw new Error("401");
  }
  return res;
}

/* The library list is kept locally as well.
   Without this the app is useless on a plane: the audio files sit in the
   Cache API, but the list of what exists only comes from /api/tracks, and the
   service worker deliberately does not intercept /api/. No list means nothing
   to tap, even though every file is right there on the device. */
const TRACKS_KEY = "dmzs_tracks";
let stale = false;

const saveTracks = (list) => {
  try { localStorage.setItem(TRACKS_KEY, JSON.stringify(list)); } catch {}
};
const loadTracks = () => {
  try { return JSON.parse(localStorage.getItem(TRACKS_KEY) || "[]"); } catch { return []; }
};

async function load() {
  let data;
  try {
    const res = await api("/api/tracks");
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    // 401 already replaced the page, nothing left to draw.
    if (String(e.message) === "401") return;

    // No connection, or the Worker is unreachable: fall back to the last
    // known library so downloaded tracks stay playable.
    console.warn("library fetch failed, falling back to the local copy", e);
    if (!tracks.length) tracks = loadTracks();
    stale = true;
    renderList();
    renderNow();
    schedulePoll();
    return;
  }
  tracks = data.tracks || [];
  stale = false;
  saveTracks(tracks);
  renderList();
  renderNow();
  schedulePoll();
  autoSweep();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  const busy = tracks.some((t) => t.status === "pending" || t.status === "downloading");
  // navigator.onLine guard: with no connection every poll is a guaranteed
  // failure, and in flight mode that would just drain the battery.
  if (busy && navigator.onLine && document.visibilityState === "visible") {
    pollTimer = setTimeout(load, 1500);
  }
}

// Connection back: pick the real library up again without a manual reload.
addEventListener("online", () => { load(); loadPods(); });

/* ═══ offline ══════════════════════════════════════════════
   Stored through the Cache API, played back from a blob: URL.
   The service worker is NOT used for audio: Safari probes every <audio> with
   a "Range: bytes=0-1", and a SW answering 200 breaks playback. A blob: URL
   bypasses fetch interception entirely.
   ════════════════════════════════════════════════════════ */
async function refreshOffline() {
  try {
    const c = await caches.open(MEDIA_CACHE);
    const keys = await c.keys();
    offline = new Set(
      keys.map((r) => new URL(r.url).pathname)
          .filter((p) => p.startsWith("/media/"))
          .map((p) => p.split("/").pop()) // works for /media/<track> and /media/ep/<episode>
    );
  } catch { offline = new Set(); }
}

async function saveOffline(id) {
  const c = await caches.open(MEDIA_CACHE);
  const res = await fetch(mediaURL(id), { credentials: "same-origin" });
  // cache.put() rejects a 206, so a complete response is required here.
  if (res.status !== 200) throw new Error("download failed");
  await c.put(mediaURL(id), res);
  // The artwork is handled by the service worker; warm it up while we are here.
  fetch(artURL(id), { credentials: "same-origin" }).catch(() => {});
  offline.add(id);
}

async function dropOffline(id) {
  const c = await caches.open(MEDIA_CACHE);
  await c.delete(mediaURL(id));
  offline.delete(id);
}

/* Put everything on the device, one at a time.
   Serial rather than parallel: ten simultaneous fetches on a mobile network
   get in each other's way, exhaust Safari's memory, and lose the count. */
let bulk = { on: false, stop: false, done: 0, total: 0 };

const ICON_DL = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>`;
const ICON_OK = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
const ICON_ST = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>`;

function renderDlAll() {
  const b = $("#dlAll");
  if (!b) return;
  const missing = tracks.filter((t) => t.status === "ready" && !offline.has(t.id)).length;

  b.classList.toggle("run", bulk.on);
  b.classList.toggle("done", !bulk.on && !missing);

  if (bulk.on) {
    b.innerHTML = `${ICON_ST}<span class="badge">${bulk.total - bulk.done}</span>`;
    b.setAttribute("aria-label", `Stop downloading, ${bulk.total - bulk.done} left`);
  } else if (missing) {
    b.innerHTML = `${ICON_DL}<span class="badge">${missing}</span>`;
    b.setAttribute("aria-label", `Download ${missing} track(s) to this device`);
  } else {
    b.innerHTML = ICON_OK;
    b.setAttribute("aria-label", "Everything is on this device");
  }
}

/* Every newly ready track goes to the device by itself. This used to be a
   switch; there was never a reason to turn it off, so it is simply on. The
   variable survives because the quota handler still flips it to stop a full
   device from retrying the same doomed download on every poll. */
let autoDl = true;

/* ═══ view settings ════════════════════════════════════════
   How this device likes its list. Kept in localStorage rather than in D1:
   the ordering a phone prefers is not a property of the library. */

/* The list owns the scrollbar, not the document, so its width is the gap
   between main's border box and its content box. Zero on iOS, where scrollbars
   float over the content. */
function measureScrollbar() {
  const m = $("#main");
  if (!m) return;
  const w = Math.max(0, m.offsetWidth - m.clientWidth);
  document.documentElement.style.setProperty("--sbw", w + "px");
}
addEventListener("resize", measureScrollbar);

/* Order of the library. buildQueue() reads the same list, so changing this
   also changes what "Play" plays, and in which direction. */
let sortMode = localStorage.getItem("dmzs_sort") === "plays" ? "plays" : "recent";

function renderSort() {
  const b = $("#sortBtn");
  b.textContent = sortMode === "plays" ? "Most played" : "Recent";
  b.classList.toggle("on", sortMode === "plays");
}

/* Starred tracks. Kept in D1 rather than on the device: which tracks are
   favourites is a property of the library, not of the phone looking at it. */
let favOnly = localStorage.getItem("dmzs_favonly") === "1";

function renderFav() {
  const b = $("#favBtn");
  b.classList.toggle("on", favOnly);
  b.setAttribute("aria-pressed", favOnly ? "true" : "false");
}

/* Anything past ten minutes is a set, not a track: a DJ mix, a live recording
   or a full album uploaded as one video is already a playlist of its own.
   Leaving those in the library means a shuffle of three-minute songs stops
   dead for an hour, so they live in their own view and the library shows only
   real tracks. The queue follows the same split, since buildQueue() reads
   visible().

   A pending track has no duration yet and therefore counts as a song until it
   is ready; a long one moves to Mixes when the downloader reports its length. */
const MIX_MIN = 600;
const isMix = (t) => (t.duration || 0) >= MIX_MIN;

let mixOnly = localStorage.getItem("dmzs_mixes") === "1";

/* Where each set was left.

   A three-minute song restarting from the top costs three minutes; an hour
   long set doing the same is simply unusable, so the position is remembered
   for mixes and for nothing else. The first and last minute are never worth
   storing: one is indistinguishable from the start, the other from the end.

   On the device rather than in D1: where the phone stopped listening is not
   where the desktop stopped, and one shared position would have them
   overwrite each other. */
const POS_KEY = "dmzs_pos";
const POS_EDGE = 60;

let positions = {};
try { positions = JSON.parse(localStorage.getItem(POS_KEY) || "{}"); } catch {}

const flushPos = () => { try { localStorage.setItem(POS_KEY, JSON.stringify(positions)); } catch {} };

function clearPos(id) {
  if (!id || positions[id] === undefined) return;
  delete positions[id];
  flushPos();
}

/* An episode's position also goes to D1, throttled, so the phone can pick
   up where the desktop stopped — that sync is the point of podcasts. 30 s
   between writes is nothing against the request allowance, and losing half
   a minute of position in a crash costs nothing either. */
let epStateSent = 0;
function pushEpState(id, data, force = false) {
  if (!force && Date.now() - epStateSent < 30000) return;
  epStateSent = Date.now();
  api(`/api/episodes/${id}/state`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  }).catch(() => {});
}

function savePos(force = false) {
  const id = queue[qi];
  const t = byId(id);
  if (!t) return;
  const ep = isEp(t);
  if (!ep && !isMix(t)) return;
  const pos = audio.currentTime || 0;
  const dur = audio.duration && isFinite(audio.duration) ? audio.duration : t.duration || 0;
  if (pos < POS_EDGE || (dur && pos > dur - POS_EDGE)) {
    clearPos(id);
    if (ep) { t.position = 0; pushEpState(id, { position: 0 }, force); }
    return;
  }
  positions[id] = Math.floor(pos);
  flushPos();
  if (ep) { t.position = positions[id]; pushEpState(id, { position: positions[id] }, force); }
}

function renderMix() {
  const b = $("#mixBtn");
  b.classList.toggle("on", mixOnly);
  b.setAttribute("aria-pressed", mixOnly ? "true" : "false");
}

async function toggleFav(id) {
  const t = byId(id);
  if (!t || isEp(t)) return; // stars are a library thing

  t.fav = t.fav ? 0 : 1;
  // Local first, so the heart answers the tap; the server catches up after.
  saveTracks(tracks);
  renderList();
  renderNow();
  toast(t.fav ? "Added to favourites" : "Removed from favourites");
  api(`/api/tracks/${id}/fav`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fav: t.fav }),
  }).catch(() => {});
}

/* Repeat is set from the full-screen player only. It persists, so a track
   left on loop is still on loop after a reload. */
function setRepeat(v) {
  repeat = v;
  localStorage.setItem("dmzs_repeat", String(repeat));
  renderNow();
}

function autoSweep() {
  if (!autoDl || bulk.on || !navigator.onLine) return;
  if (!tracks.some((t) => t.status === "ready" && !offline.has(t.id))) return;
  downloadAll(true);
}

async function downloadAll(silent = false) {
  if (bulk.on) {
    if (silent) return;
    bulk.stop = true;
    toast("Stopping after the current track…");
    return;
  }

  const missing = tracks.filter((t) => t.status === "ready" && !offline.has(t.id));
  if (!missing.length) return silent || toast("Everything is already on this device");
  if (!navigator.onLine) return silent || toast("Offline — a connection is required");

  bulk = { on: true, stop: false, done: 0, total: missing.length };
  renderDlAll();

  let failed = 0;
  let full = false;

  for (const t of missing) {
    if (bulk.stop) break;
    try {
      await saveOffline(t.id);
    } catch (e) {
      failed++;
      // Safari throws QuotaExceededError when the app's container is full.
      // Insisting is pointless: the next ones would fail just the same.
      if (e && (e.name === "QuotaExceededError" || /quota/i.test(e.message || ""))) {
        full = true;
        break;
      }
    }
    bulk.done++;
    renderDlAll();
    renderList();
  }

  const stopped = bulk.stop;
  const ok = bulk.done - failed;
  bulk = { on: false, stop: false, done: 0, total: 0 };
  renderDlAll();
  renderList();

  if (full) {
    // Turn auto off: without this, every poll would restart a download that
    // is doomed to fail, forever.
    autoDl = false;
    toast("Storage full — auto-download turned off");
  } else if (silent) {
    if (failed) toast(`${failed} track${failed > 1 ? "s" : ""} failed`);
  } else if (stopped) toast(`Stopped · ${ok} on this device`);
  else if (failed) toast(`${ok} downloaded, ${failed} failed`);
  else toast(`${ok} track${ok > 1 ? "s" : ""} on this device`);
}

async function srcFor(id) {
  try {
    const c = await caches.open(MEDIA_CACHE);
    const hit = await c.match(mediaURL(id));
    if (hit) {
      const blob = await hit.blob();
      return URL.createObjectURL(blob);
    }
  } catch {}
  return mediaURL(id);
}

/* ═══ rendering ════════════════════════════════════════════ */
function visible() {
  const q = $("#q").value.trim().toLowerCase();
  // A search deliberately ignores the mixes split and looks through the whole
  // library: refusing to find a mix by name would read as the track being lost.
  let list = q
    ? tracks.filter((t) => (t.title + " " + t.artist).toLowerCase().includes(q))
    : tracks.filter((t) => isMix(t) === mixOnly);

  // Filtering here rather than at render time is what makes "play only the
  // favourites" work: buildQueue() reads this same list.
  if (favOnly) list = list.filter((t) => t.fav);

  if (sortMode === "plays") {
    // Copy before sorting: `tracks` holds the server order, which "Recent"
    // depends on, and sort() would rearrange it in place.
    list = [...list].sort(
      (a, b) => (b.plays || 0) - (a.plays || 0) || (b.created_at || 0) - (a.created_at || 0)
    );
  }
  return list;
}
const playable = () => visible().filter((t) => t.status === "ready");

/* Why the list is empty is never obvious from an empty list: a filter is on,
   a search found nothing, or the library really is new. */
function emptyText() {
  if ($("#q").value.trim()) return "No results.";
  if (favOnly) return "<b>No favourites here.</b>Swipe a row left to star a track.";
  if (mixOnly) return "<b>No mixes yet.</b>Anything over ten minutes lands here.";
  if (tracks.length) return "<b>Nothing under ten minutes.</b>The library is all in Mixes.";
  return "<b>Nothing here yet.</b>Paste a YouTube link to get started.";
}

function renderList() {
  if (podMode) { renderPodList(); return; }
  const rows = visible();
  const cur = queue[qi];

  $("#list").innerHTML = rows.length
    ? rows.map((t) => {
        const busy = t.status === "pending" || t.status === "downloading";
        const err  = t.status === "error";
        const isCur = t.id === cur && t.status === "ready";
        const sub = busy ? (t.stage || "Waiting…") : err ? (t.error || "Failed") : t.artist;

        let right;
        if (busy) right = `<span class="pct num">${t.progress || 0} %</span>`;
        else if (err) right = `<span class="pct num" style="color:var(--red)">!</span>`;
        else if (isCur) right = `<div class="eq"><i></i><i></i><i></i></div>`;
        else right = `<span class="off${offline.has(t.id) ? " on" : ""}">${
              offline.has(t.id)
                ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`
                : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v8m0 0 3-3m-3 3-3-3"/></svg>`
            }</span>`;

        return `<div class="row${isCur ? " cur" : ""}${isCur && !audio.paused ? " playing" : ""}${busy ? " busy" : ""}${err ? " err" : ""}" data-id="${t.id}">
          <div class="art">${artHTML(t)}</div>
          <div class="info"><div class="ttl tr">${esc(t.title)}</div><div class="art2 tr">${esc(sub)}</div></div>
          <div class="right">
            ${!busy && !err && t.fav ? `<span class="favmark" aria-label="Favourite"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.4-4.6-9.2-8.6C1.4 8.6 3 5.3 6.1 4.6c2-.5 3.9.4 4.9 2 1-1.6 2.9-2.5 4.9-2 3.1.7 4.7 4 3.3 7.1-1.8 4-9.2 8.6-9.2 8.6z"/></svg></span>` : ""}
            ${!busy && !err && t.plays ? `<span class="plays num" title="${t.plays} play${t.plays > 1 ? "s" : ""}"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.53.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>${t.plays}</span>` : ""}
            ${right}
            ${!busy && !err ? `<span class="dur num">${mmss(t.duration)}</span>` : ""}
            <button class="dots" data-menu="${t.id}" aria-label="Options">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>
            </button>
          </div>
          ${busy ? `<div class="rowbar"><i style="width:${t.progress || 0}%"></i></div>` : ""}
        </div>`;
      }).join("")
    : `<div class="empty">${emptyText()}</div>`;

  const ready = tracks.filter((t) => t.status === "ready");
  const bytes = ready.reduce((s, t) => s + (t.size || 0), 0);
  const off = ready.filter((t) => offline.has(t.id)).length;
  // Counted apart, because they are shown apart: one number covering both
  // would claim tracks the library is not showing.
  const mixes = ready.filter(isMix).length;
  const songs = ready.length - mixes;
  $("#hmeta").textContent = ready.length
    ? `${songs} track${songs > 1 ? "s" : ""}` +
      (mixes ? ` · ${mixes} mix${mixes > 1 ? "es" : ""}` : "") +
      ` · ${fmtSize(bytes)} · ${off} offline` +
      (stale ? " · no connection" : "")
    : stale
      ? "No connection, and nothing stored on this device"
      : "Empty library";

  $("#dlAll").hidden = !ready.length;
  renderDlAll();
}

/* The full-screen artwork used to be rebuilt from scratch on every track
   change: the letter placeholder painted immediately and the <img> arrived a
   moment later, so skipping through tracks flashed letter, cover, letter,
   cover. The elements are built once and the image is swapped only once the
   next one has finished loading, so the previous cover holds until then.

   npArtId also guards against a fast skip: if the track changed again while an
   image was in flight, the late arrival is dropped rather than painted over
   whatever is now playing. */
/* One definition, used by the mini bar and the full-screen player. */
const HEART_FILLED = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3s-7.4-4.6-9.2-8.6C1.4 8.6 3 5.3 6.1 4.6c2-.5 3.9.4 4.9 2 1-1.6 2.9-2.5 4.9-2 3.1.7 4.7 4 3.3 7.1-1.8 4-9.2 8.6-9.2 8.6z"/></svg>`;
const HEART_OUTLINE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3s-7.4-4.6-9.2-8.6C1.4 8.6 3 5.3 6.1 4.6c2-.5 3.9.4 4.9 2 1-1.6 2.9-2.5 4.9-2 3.1.7 4.7 4 3.3 7.1-1.8 4-9.2 8.6-9.2 8.6z"/></svg>`;

let npArtId = null;

function setNpArt(t) {
  const box = $("#npArt");
  if (!t) { npArtId = null; box.innerHTML = ""; return; }
  if (npArtId === t.id) return;
  npArtId = t.id;

  if (!box.querySelector(".fb") || !box.querySelector("img")) {
    box.innerHTML = `<div class="fb"></div><img alt="" style="opacity:0">`;
  }
  const fb = box.querySelector(".fb");
  const img = box.querySelector("img");

  const h = hue(t.title + t.artist);
  // textContent rather than a built string: no escaping to get wrong.
  fb.textContent = ((t.title || "?").trim()[0] || "?").toUpperCase();
  fb.style.background =
    `linear-gradient(145deg,hsl(${h} 34% 30%),hsl(${(h + 42) % 360} 30% 15%))`;

  if (t.status !== "ready") { img.style.opacity = "0"; return; }

  const pre = new Image();
  pre.onload = () => {
    if (npArtId !== t.id) return;
    img.src = pre.src;
    img.style.opacity = "1";
  };
  pre.onerror = () => { if (npArtId === t.id) img.style.opacity = "0"; };
  pre.src = artURL(t.id);
}

function renderNow() {
  const t = byId(queue[qi]);
  $("#mini").classList.toggle("up", !!t);
  if (!t) return;

  $("#mArt").innerHTML = artHTML(t);
  $("#mTtl").textContent = t.title;
  $("#mArtist").textContent = t.artist || "—";
  setNpArt(t);
  $("#npTtl").textContent = t.title;
  $("#npArtist").textContent = t.artist || "—";
  $("#npbg").style.backgroundImage = `url(${artURL(t.id)})`;
  $("#npState").textContent = offline.has(t.id) ? "On this device" : "Streaming";
  $("#mFav").innerHTML = t.fav ? HEART_FILLED : HEART_OUTLINE;
  $("#mFav").classList.toggle("on", Boolean(t.fav));
  $("#mFav").setAttribute("aria-label", t.fav ? "Remove from favourites" : "Add to favourites");
  $("#npFav").innerHTML = t.fav ? HEART_FILLED : HEART_OUTLINE;
  $("#npFav").classList.toggle("on", Boolean(t.fav));
  $("#npFav").setAttribute("aria-label", t.fav ? "Remove from favourites" : "Add to favourites");

  // Episodes: no stars, but a playback speed. Tracks: the reverse.
  $("#mFav").style.visibility = isEp(t) ? "hidden" : "";
  $("#npFav").style.visibility = isEp(t) ? "hidden" : "";
  $("#npRate").classList.toggle("show", isEp(t));
  $("#npRate").textContent = fmtRate(podRate);

  const playing = !audio.paused;
  $("#mPlay").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $("#npplay").innerHTML = playing ? ICON_PAUSE_L : ICON_PLAY_L;
  $("#np").classList.toggle("playing", playing);
  $("#npShuf").classList.toggle("on", shuffle);
  $("#npRep").classList.toggle("on", repeat > 0);
  $("#npRep").setAttribute(
    "aria-label",
    ["Repeat off", "Repeat the queue", "Repeat this track"][repeat]
  );
  $("#npSrc").textContent =
    repeat === 2 ? "Repeating this track" : shuffle ? `Shuffle · ${queueSrc}` : queueSrc;
  renderProgress();
}

function renderProgress() {
  const t = byId(queue[qi]);
  if (!t) return;
  const dur = audio.duration && isFinite(audio.duration) ? audio.duration : t.duration || 0;
  const pos = audio.currentTime || 0;
  const p = dur ? Math.min(100, (pos / dur) * 100) : 0;
  $("#npFill").style.width = p + "%";
  $("#mprog").style.width = p + "%";
  $("#npCur").textContent = mmss(pos);
  $("#npRem").textContent = "-" + mmss(Math.max(0, dur - pos));
  // A 5px line is not something a position can be read off, so while the mini
  // bar is being dragged its subtitle carries the time. renderNow() puts the
  // artist back when the drag ends.
  if ($("#mini").classList.contains("seek")) {
    $("#mArtist").textContent = `${mmss(pos)} / ${mmss(dur)}`;
  }
}

/* ═══ Media Session ════════════════════════════════════════ */
function updateMediaSession(t) {
  if (!("mediaSession" in navigator) || !t) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.artist || "",
      album: isEp(t) ? t.artist : "Library",
      // Small sizes matter too: without them, the compact player on the iOS
      // lock screen shows a grey square.
      artwork: [96, 128, 192, 256, 384, 512].map((s) => ({
        src: artURL(t.id), sizes: `${s}x${s}`, type: "image/jpeg",
      })),
    });
    navigator.mediaSession.setActionHandler("play", () => toggle());
    navigator.mediaSession.setActionHandler("pause", () => toggle());
    navigator.mediaSession.setActionHandler("nexttrack", () => next());
    navigator.mediaSession.setActionHandler("previoustrack", () => prev());
    navigator.mediaSession.setActionHandler("seekto", (e) => {
      if (e.seekTime != null) { audio.currentTime = e.seekTime; renderProgress(); }
    });
  } catch {}
}

function syncSessionState() {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
    const d = audio.duration;
    if (d && isFinite(d)) {
      navigator.mediaSession.setPositionState({
        duration: d, position: Math.min(audio.currentTime, d), playbackRate: audio.playbackRate || 1,
      });
    }
  } catch {}
}

/* ═══ playback ═════════════════════════════════════════════ */
function buildQueue(startId) {
  queueSrc = mixOnly ? "Mixes" : favOnly ? "Favourites" : "Library";
  let ids = playable().map((t) => t.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    if (startId) { ids = ids.filter((i) => i !== startId); ids.unshift(startId); }
  }
  queue = ids;
  qi = startId ? ids.indexOf(startId) : 0;
}

async function loadInto(id) {
  if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
  countedId = null;
  const src = await srcFor(id);
  if (src.startsWith("blob:")) objectURL = src;
  audio.src = src;
  // Speed belongs to podcasts; music always plays straight.
  audio.playbackRate = isEp(byId(id)) ? podRate : 1;

  // Back where the set was left. currentTime cannot be set before the browser
  // knows the duration, hence the wait; the id is checked again there because
  // a fast skip can change the track while the metadata is still in flight.
  const at = positions[id];
  if (at) {
    audio.addEventListener("loadedmetadata", () => {
      if (queue[qi] !== id) return;
      audio.currentTime = at;
      renderProgress();
      toast(`Resuming at ${mmss(at)}`);
    }, { once: true });
  }
}

/* Play counter. Counted the moment the track starts.

   The trigger is `playing` and not `play`: the latter fires on the intent, so
   a track that then fails to load or never gets past buffering would still be
   counted. countedId is cleared in loadInto(), which is the only place a new
   track is put on the element, so pausing and resuming, seeking, or looping on
   repeat-one all stay at one play. */
let countedId = null;

function countPlay() {
  const id = queue[qi];
  if (!id || id === countedId) return;
  const t = byId(id);
  if (!t || t.status !== "ready" || isEp(t)) return; // episodes have `played`, not a counter

  countedId = id;
  // Increment locally right away, so the display does not wait on the round trip.
  t.plays = (t.plays || 0) + 1;
  saveTracks(tracks);
  renderList();
  // Offline this POST simply fails: the count stays local until the next
  // successful load, which then overwrites it with the server's value.
  api(`/api/tracks/${id}/play`, { method: "POST" }).catch(() => {});
}

async function play(id) {
  if (id) {
    if (!queue.includes(id)) buildQueue(id);
    else qi = queue.indexOf(id);
    await loadInto(id);
  } else if (qi < 0 && queue.length) {
    qi = 0;
    await loadInto(queue[0]);
  }
  const t = byId(queue[qi]);
  if (!t) return;
  updateMediaSession(t);
  audio.playbackRate = isEp(t) ? podRate : 1;
  try {
    await audio.play();
  } catch (e) {
    toast(navigator.onLine ? "Playback failed" : "Track not available offline");
  }
  renderNow(); renderList(); syncSessionState();
}

function toggle() {
  if (audio.paused) {
    if (qi < 0) { startAll(false); return; }
    play();
  } else {
    audio.pause();
  }
}

async function next(auto) {
  if (!queue.length) return;
  if (auto && REP[repeat] === "one") { audio.currentTime = 0; await play(); return; }
  if (qi >= queue.length - 1) {
    if (REP[repeat] === "all" || !auto) qi = 0;
    else { audio.pause(); audio.currentTime = 0; renderNow(); renderList(); return; }
  } else qi++;
  await loadInto(queue[qi]);
  await play();
}

async function prev() {
  if (!queue.length) return;
  if (audio.currentTime > 4) { audio.currentTime = 0; renderProgress(); return; }
  qi = qi <= 0 ? queue.length - 1 : qi - 1;
  await loadInto(queue[qi]);
  await play();
}

function startAll(rnd) {
  if (!playable().length) { toast("No track ready"); return; }
  shuffle = rnd;
  buildQueue();
  play(queue[0]);
  if (rnd) toast("Shuffling");
}

// timeupdate fires four times a second; writing to localStorage that often
// would be pointless. Every five seconds of playback is enough to survive the
// app being killed in the background, which is how a session usually ends.
let posSaved = 0;

audio.addEventListener("timeupdate", () => {
  renderProgress();
  if (Math.abs(audio.currentTime - posSaved) < 5) return;
  posSaved = audio.currentTime;
  savePos();
});
audio.addEventListener("playing", () => countPlay());
audio.addEventListener("durationchange", () => { renderProgress(); syncSessionState(); });
audio.addEventListener("ended", () => {
  const t = byId(queue[qi]);
  if (isEp(t)) {
    // Listened to the end: finished, and next time starts from the top.
    t.played = 1;
    t.position = 0;
    pushEpState(t.id, { position: 0, played: 1 }, true);
  }
  clearPos(queue[qi]);
  next(true);
});
audio.addEventListener("play", () => { renderNow(); renderList(); syncSessionState(); });
audio.addEventListener("pause", () => { savePos(true); renderNow(); renderList(); syncSessionState(); });
audio.addEventListener("error", () => {
  if (audio.src) toast("This track could not be played");
});

/* ═══ events: list ═════════════════════════════════════════ */
$("#list").addEventListener("click", (e) => {
  if (podMode) {
    // The overflow dots first: they live inside rows that also navigate.
    const pm = e.target.closest("[data-podmenu]");
    if (pm) { openPodMenu(pm.dataset.podmenu); return; }
    const em = e.target.closest("[data-epmenu]");
    if (em) { openEpMenu(em.dataset.epmenu); return; }
    if (e.target.closest("#podBack")) { curPod = null; renderList(); return; }
    if (e.target.closest("#podAdd")) {
      openSheet("#podSheet");
      setTimeout(() => $("#podUrl").focus(), 80);
      return;
    }
    const pr = e.target.closest("[data-pod]");
    if (pr) { curPod = pr.dataset.pod; renderList(); return; }
    const er = e.target.closest("[data-ep]");
    if (er) {
      const ep = epById(er.dataset.ep);
      if (!ep) return;
      if (ep.status === "ready") { ep.id === queue[qi] ? toggle() : playEp(ep.id); return; }
      if (ep.status === "queued" || ep.status === "fetching") { toast("Fetching this episode…"); return; }
      if (ep.status === "error") { openEpMenu(ep.id); return; }
      // 'new': tapping an episode means "I want to hear it" — fetch it.
      fetchEp(ep.id);
    }
    return;
  }

  const m = e.target.closest("[data-menu]");
  if (m) { openMenu(m.dataset.menu); return; }
  const r = e.target.closest(".row");
  if (!r) return;
  const t = byId(r.dataset.id);
  if (!t) return;
  if (t.status === "error") { openMenu(t.id); return; }
  if (t.status !== "ready") { toast(t.stage || "Downloading…"); return; }
  if (t.id === queue[qi]) toggle(); else play(t.id);
});

/* scrubber
   Two surfaces seek the same timeline: the bar in the full-screen player, and
   the progress line on the mini bar. Both end up here. */
function seekRatio(p) {
  const t = byId(queue[qi]);
  if (!t) return;
  const dur = audio.duration && isFinite(audio.duration) ? audio.duration : t.duration || 0;
  if (!dur) return;
  audio.currentTime = Math.max(0, Math.min(1, p)) * dur;
  renderProgress();
}
const ratioIn = (el, e) => {
  const b = el.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - b.left;
  return x / b.width;
};

const scrub = $("#scrub");
const seek = (e) => seekRatio(ratioIn(scrub.querySelector(".bar"), e));
scrub.addEventListener("pointerdown", (e) => { scrub.setPointerCapture(e.pointerId); seek(e); });
scrub.addEventListener("pointermove", (e) => { if (scrub.hasPointerCapture(e.pointerId)) seek(e); });

/* The same timeline, without opening the player: drag along the top of the
   mini bar and the track follows.

   Deliberately not an overlay with its own hit area. A strip tall enough to
   catch a thumb would sit on top of the artwork and the play button and eat
   their taps. This is a plain pointerdown on the bar that only becomes a
   scrub once the thumb has actually travelled sideways, so a tap goes
   through untouched and still opens the full-screen player.

   The click that follows a real drag is swallowed: the pointer is released
   over the title or a button, whose handler would otherwise fire. */
(function miniScrub() {
  const mini = $("#mini");
  const ZONE = 20;   // px from the top of the bar that arm the gesture
  const SLOP = 8;    // px of travel before it counts as a drag
  let armed = false, live = false, x0 = 0, pid = null, swallow = false;

  function stop() {
    armed = false;
    if (pid !== null) {
      try { mini.releasePointerCapture(pid); } catch {}
      pid = null;
    }
    if (!live) return;
    live = false;
    mini.classList.remove("seek");
    swallow = true;
    // The click may never come (a drag ending outside the bar), so the guard
    // expires on its own rather than eating the next unrelated tap.
    setTimeout(() => { swallow = false; }, 400);
    renderNow();
  }

  mini.addEventListener("pointerdown", (e) => {
    if (qi < 0) return;
    if (e.clientY - mini.getBoundingClientRect().top > ZONE) return;
    armed = true; live = false; x0 = e.clientX; pid = e.pointerId;
  });

  mini.addEventListener("pointermove", (e) => {
    if (!armed) return;
    if (!live) {
      if (Math.abs(e.clientX - x0) < SLOP) return;
      live = true;
      mini.classList.add("seek");
      try { mini.setPointerCapture(pid); } catch {}
    }
    seekRatio(ratioIn(mini, e));
  });

  mini.addEventListener("pointerup", stop);
  mini.addEventListener("pointercancel", stop);

  addEventListener("click", (e) => {
    if (!swallow) return;
    swallow = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

/* Swipe the full-screen player: down to close, left and right to change
   track. The axis is decided once, on the first few pixels, and then held for
   the rest of the gesture, so a drag that wanders diagonally does not flip
   between closing and skipping halfway through.

   The artwork alone follows a horizontal swipe. Sliding the whole screen would
   mean animating the blurred backdrop too, which is expensive, and it reads
   just as well as the record being pushed aside. */
let dy = 0, dx = 0, y0 = null, x0 = 0, axis = null;

const npArtBox = () => $("#npArt").parentElement;

$("#np").addEventListener("touchstart", (e) => {
  y0 = e.touches[0].clientY;
  x0 = e.touches[0].clientX;
  dy = dx = 0;
  axis = null;
  npArtBox().style.transition = "none";
}, { passive: true });

$("#np").addEventListener("touchmove", (e) => {
  if (y0 === null || e.target.closest("#scrub, .transport")) return;
  const ry = e.touches[0].clientY - y0;
  const rx = e.touches[0].clientX - x0;

  if (!axis) {
    if (Math.abs(rx) < 10 && Math.abs(ry) < 10) return;
    axis = Math.abs(rx) > Math.abs(ry) ? "x" : "y";
  }

  if (axis === "y") {
    dy = Math.max(0, ry);
    $("#np").style.transform = `translateY(${dy}px)`;
  } else {
    dx = rx;
    // Damped, so it is obvious the artwork is being dragged rather than thrown.
    npArtBox().style.transform = `translateX(${rx * 0.55}px)`;
    npArtBox().style.opacity = String(Math.max(0.35, 1 - Math.abs(rx) / 420));
  }
}, { passive: true });

$("#np").addEventListener("touchend", () => {
  $("#np").style.transform = "";
  npArtBox().style.transition = "";
  npArtBox().style.transform = "";
  npArtBox().style.opacity = "";

  if (axis === "y" && dy > 95) $("#np").classList.remove("up");
  // Left goes forward, matching the direction the queue moves.
  else if (axis === "x" && dx < -70) next(false);
  else if (axis === "x" && dx > 70) prev();

  y0 = null;
  axis = null;
});

/* Swipe a row sideways to star it: left adds, right removes.

   The axis is locked on the first ten pixels and held for the rest of the
   gesture, so a thumb travelling diagonally down the list scrolls instead of
   quietly restarring things. Rows are re-rendered wholesale by renderList(),
   so every inline style set here is cleared before that can happen. */
(function rowSwipe() {
  const list = $("#list");
  const HOLD = 70;
  let row = null, id = null, x0 = 0, y0 = 0, dx = 0, axis = null;

  function reset() {
    if (!row) return;
    row.style.transition = "";
    row.style.transform = "";
    row.classList.remove("sw-on", "sw-off");
    row = null;
    axis = null;
  }

  list.addEventListener("touchstart", (e) => {
    const r = e.target.closest(".row");
    // The overflow button owns its own tap.
    if (!r || e.target.closest(".dots")) return;
    row = r;
    id = r.dataset.id;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    dx = 0;
    axis = null;
    row.style.transition = "none";
  }, { passive: true });

  list.addEventListener("touchmove", (e) => {
    if (!row) return;
    const rx = e.touches[0].clientX - x0;
    const ry = e.touches[0].clientY - y0;

    if (!axis) {
      // The browser keeps vertical panning for itself (touch-action: pan-y),
      // and nothing said here can take it back once a gesture is under way.
      // So the test is deliberately lopsided: a swipe only counts as
      // horizontal when it is clearly horizontal. Anything ambiguous becomes a
      // scroll and never a swipe, which is what stops the row sliding sideways
      // while the list scrolls underneath it.
      if (Math.abs(ry) > 8) { reset(); return; }
      if (Math.abs(rx) < 14) return;
      if (Math.abs(rx) < Math.abs(ry) * 1.8) { reset(); return; }
      axis = "x";
    }

    // Locked horizontal: a late vertical wander is ignored rather than
    // fighting the transform.

    dx = rx;
    // Damped: the row follows the thumb without running away from it.
    row.style.transform = `translateX(${rx * 0.55}px)`;
    row.classList.toggle("sw-on", rx < -20);
    row.classList.toggle("sw-off", rx > 20);
  }, { passive: true });

  list.addEventListener("touchend", () => {
    if (!row || axis !== "x") return reset();
    const t = byId(id);
    const d = dx;
    reset();
    if (!t || t.status !== "ready") return;

    if (d < -HOLD) t.fav ? toast("Already a favourite") : toggleFav(t.id);
    else if (d > HOLD) t.fav ? toggleFav(t.id) : toast("Not a favourite");
  });

  list.addEventListener("touchcancel", reset);
})();

/* ═══ sheets ═══════════════════════════════════════════════ */
const openSheet = (s) => { $("#scrim").classList.add("up"); $(s).classList.add("up"); };
function closeSheets() {
  $("#scrim").classList.remove("up");
  document.querySelectorAll(".sheet").forEach((s) => s.classList.remove("up"));
}
$("#scrim").addEventListener("click", closeSheets);

/* Drag a sheet down to dismiss it.

   The grab handle at the top promised this gesture and nothing implemented it,
   so the only way out was the scrim behind. Pointer events cover touch and
   mouse in one path.

   Two things keep taps working. The drag only begins past a few pixels of
   mostly-vertical movement, so a tap on a menu row never turns into a drag.
   And pointer capture is deliberately not used: it would retarget the events
   and swallow the click on the row underneath. */
function dismissable(sheet) {
  const CLOSE_AT = 90;     // px dragged before it counts as a dismissal
  const SPEED_AT = 0.5;    // px per ms, so a short flick works too
  let y0 = 0, x0 = 0, dy = 0, t0 = 0, live = false, armed = false;

  const move = (e) => {
    if (!armed) return;
    const d = e.clientY - y0;

    if (!live) {
      // Ignore horizontal wandering and the jitter of a normal tap.
      if (Math.abs(d) < 6) return;
      if (Math.abs(e.clientX - x0) > Math.abs(d)) { armed = false; return; }
      live = true;
      sheet.style.transition = "none";
    }

    dy = Math.max(0, d);
    sheet.style.transform = `translateY(${dy}px)`;
    // The backdrop lifts with the sheet, so the gesture feels attached.
    $("#scrim").style.opacity = String(Math.max(0, 1 - dy / 280));
    e.preventDefault();
  };

  const end = () => {
    if (!armed) return;
    armed = false;
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", end);
    removeEventListener("pointercancel", end);
    if (!live) return;

    live = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    $("#scrim").style.opacity = "";
    if (dy > CLOSE_AT || dy / Math.max(1, Date.now() - t0) > SPEED_AT) closeSheets();
  };

  sheet.addEventListener("pointerdown", (e) => {
    // Let the URL field be selected and scrubbed without the sheet moving.
    if (e.target.closest("input, textarea")) return;
    y0 = e.clientY; x0 = e.clientX; dy = 0; t0 = Date.now();
    armed = true; live = false;
    addEventListener("pointermove", move, { passive: false });
    addEventListener("pointerup", end);
    addEventListener("pointercancel", end);
  });
}

document.querySelectorAll(".sheet").forEach(dismissable);

/* -- adding a track -- */
let adding = false;
/* -- context menu -- */

    : t.status === "error" ? (t.error || "Failed") : (t.stage || "Working…");
