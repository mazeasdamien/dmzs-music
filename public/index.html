async function toggleOffline(id) {
  const has = offline.has(id);
  try {
    if (has) { await dropOffline(id); toast("Removed from device"); }
    else { toast("Downloading…"); await saveOffline(id); toast("Available offline"); }
  } catch {
    toast("Download failed");
  }
  renderList(); renderNow();
}

$("#menuSheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]");
  if (!b || !menuId) return;
  const id = menuId;
  const action = b.dataset.a;
  closeSheets();

  if (action === "play") { play(id); return; }
  if (action === "fav") { toggleFav(id); return; }
  if (action === "dl") { toggleOffline(id); return; }
  if (action === "retry") {
    await api("/api/tracks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${id}` }),
    }).catch(() => {});
    toast("Retrying");
    load();
    return;
  }
  if (action === "del") {
    if (queue[qi] === id) { audio.pause(); audio.removeAttribute("src"); qi = -1; queue = []; $("#mini").classList.remove("up"); }
    await dropOffline(id).catch(() => {});
    clearPos(id);
    await api(`/api/tracks/${id}`, { method: "DELETE" }).catch(() => {});
    tracks = tracks.filter((t) => t.id !== id);
    // qi is an index, so removing anything ahead of it in the queue shifts it
    // onto the wrong track: the bar would name the next one while the audio
    // kept playing the current one, and "next" would skip a track. Follow the
    // id across the filter instead of trusting the position.
    const cur = queue[qi];
    queue = queue.filter((x) => x !== id);
    qi = cur ? queue.indexOf(cur) : -1;
    toast("Deleted");
    renderList(); renderNow();
  }
});

/* ═══ podcasts ═════════════════════════════════════════════ */
const DOTS = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>`;
const ICON_CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
const ICON_CLOUD_DL = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.6A4.5 4.5 0 0 0 17.5 8.4 6 6 0 0 0 6 10a4 4 0 0 0-2 7.4"/><path d="M12 11v7m0 0 2.5-2.5M12 18l-2.5-2.5"/></svg>`;
const ICON_OFF_DOT = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v8m0 0 3-3m-3 3-3-3"/></svg>`;

const fmtRate = (r) => (r === 1 ? "1×" : r + "×");

function epDate(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, sameYear
    ? { day: "numeric", month: "short" }
    : { day: "numeric", month: "short", year: "numeric" });
}

/* Podcasts replace the library rather than filter it, so the library's own
   filters are dropped on the way in. Leaving one latched is invisible while
   podcast mode hides both pills, and coming back would land on a filtered list
   nobody asked for. */
function clearLibraryFilters() {
  favOnly = false;
  mixOnly = false;
  localStorage.setItem("dmzs_favonly", "0");
  localStorage.setItem("dmzs_mixes", "0");
  renderFav();
  renderMix();
}

function renderPodPill() {
  $("#podBtn").classList.toggle("on", podMode);
  $("#podBtn").setAttribute("aria-pressed", podMode ? "true" : "false");
  // Library-only controls make no sense over podcasts, and vice versa.
  $("#sortBtn").hidden = podMode;
  $("#favBtn").hidden = podMode;
  $("#mixBtn").hidden = podMode;
  document.querySelector(".actions").hidden = podMode;
}

/* Same plane rule as the track list: the last known state is kept on the
   device, so episodes already downloaded stay listed and playable offline. */
async function loadPods() {
  try {
    const res = await api("/api/podcasts");
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    pods = data.podcasts || [];
    const names = Object.fromEntries(pods.map((p) => [p.id, p.title]));
    eps = (data.episodes || []).map((e) => ({
      ...e,
      pod: e.podcast_id,
      artist: names[e.podcast_id] || "Podcast", // what the player shows on line two
    }));
    // The server remembers where another device stopped. The bigger position
    // wins, so a deliberate rewind on this device is not quietly undone.
    let touched = false;
    for (const e of eps) {
      if (e.position > 0 && e.position > (positions[e.id] || 0)) {
        positions[e.id] = e.position;
        touched = true;
      }
    }
    if (touched) flushPos();
    podsLoaded = true;
    try { localStorage.setItem(PODS_KEY, JSON.stringify({ pods, eps })); } catch {}
  } catch (e) {
    if (String(e.message) === "401") return;
    if (!podsLoaded) {
      try {
        const c = JSON.parse(localStorage.getItem(PODS_KEY) || "{}");
        pods = c.pods || [];
        eps = c.eps || [];
      } catch {}
      podsLoaded = true;
    }
  }
  if (podMode) renderList();
  schedulePodPoll();
}

function schedulePodPoll() {
  clearTimeout(podTimer);
  const busy = eps.some((e) => e.status === "queued" || e.status === "fetching");
  if (busy && navigator.onLine && document.visibilityState === "visible") {
    podTimer = setTimeout(loadPods, 2500);
  }
}

function podRow(p) {
  const list = eps.filter((e) => e.pod === p.id);
  const ready = list.filter((e) => e.status === "ready");
  const fresh = ready.filter((e) => !e.played).length;
  const h = hue(p.title);
  const sub = p.last_error ? p.last_error : (p.author || `${list.length} episode${list.length !== 1 ? "s" : ""}`);
  return `<div class="row${p.last_error ? " err" : ""}" data-pod="${p.id}">
    <div class="art">
      <div class="fb" style="background:linear-gradient(145deg,hsl(${h} 34% 30%),hsl(${(h + 42) % 360} 30% 15%))">${esc(((p.title || "?").trim()[0] || "?").toUpperCase())}</div>
      <img src="/art/pod/${p.id}" alt="" loading="lazy" onerror="this.remove()">
    </div>
    <div class="info"><div class="ttl tr">${esc(p.title)}</div><div class="art2 tr">${esc(sub)}</div></div>
    <div class="right">
      ${fresh ? `<span class="pct num">${fresh} new</span>` : `<span class="dur num">${ready.length} ready</span>`}
      <button class="dots" data-podmenu="${p.id}" aria-label="Options">${DOTS}</button>
    </div>
  </div>`;
}

function epRow(e) {
  const busy = e.status === "queued" || e.status === "fetching";
  const err = e.status === "error";
  const isCur = e.id === queue[qi] && e.status === "ready";
  const at = positions[e.id];
  const sub = busy
    ? (e.status === "queued" ? "Queued…" : "Fetching…")
    : err ? (e.error || "Failed")
    : [e.played ? "Played" : "", epDate(e.published_at), e.duration ? mmss(e.duration) : "", at ? `resumes at ${mmss(at)}` : ""]
        .filter(Boolean).join(" · ");

  let right;
  if (busy) right = `<span class="pct num">…</span>`;
  else if (err) right = `<span class="pct num" style="color:var(--red)">!</span>`;
  else if (isCur) right = `<div class="eq"><i></i><i></i><i></i></div>`;
  else if (e.status === "ready") right = `<span class="off${offline.has(e.id) ? " on" : ""}">${offline.has(e.id) ? ICON_CHECK : ICON_OFF_DOT}</span>`;
  else right = `<span class="off">${ICON_CLOUD_DL}</span>`; // not in the cloud yet: tap to fetch

  const pct = at && e.duration ? Math.min(100, Math.round((at / e.duration) * 100)) : 0;

  return `<div class="row${isCur ? " cur" : ""}${isCur && !audio.paused ? " playing" : ""}${busy ? " busy" : ""}${err ? " err" : ""}${e.played ? " done" : ""}" data-ep="${e.id}">
    <div class="art">${artHTML(e)}</div>
    <div class="info"><div class="ttl tr">${esc(e.title)}</div><div class="art2 tr">${esc(sub)}</div></div>
    <div class="right">
      ${right}
      <button class="dots" data-epmenu="${e.id}" aria-label="Options">${DOTS}</button>
    </div>
    ${pct && !busy && !err ? `<div class="rowbar"><i style="width:${pct}%"></i></div>` : ""}
  </div>`;
}

function renderPodList() {
  const q = $("#q").value.trim().toLowerCase();
  let html;

  if (curPod && !pods.some((p) => p.id === curPod)) curPod = null;

  if (curPod) {
    const pod = pods.find((p) => p.id === curPod);
    let list = eps.filter((e) => e.pod === curPod);
    if (q) list = list.filter((e) => (e.title + " " + (e.description || "")).toLowerCase().includes(q));
    const kept = eps.filter((e) => e.pod === curPod && e.status === "ready").length;
    html =
      `<div class="row" id="podBack" style="height:46px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
        <div class="info"><div class="art2">All podcasts</div></div>
        <button class="dots" data-podmenu="${pod.id}" aria-label="Show options">${DOTS}</button>
      </div>` +
      (list.length
        ? list.map(epRow).join("")
        : `<div class="empty">${q ? "No results." : "<b>No episodes.</b>The feed lists nothing playable."}</div>`);
    $("#hmeta").textContent = `${pod.title} · ${kept} in the cloud`;
  } else {
    let list = pods;
    if (q) list = list.filter((p) => (p.title + " " + (p.author || "")).toLowerCase().includes(q));
    html =
      `<div class="row addrow" id="podAdd" style="height:50px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <div class="info"><div class="ttl">Add a podcast</div></div>
      </div>` +
      (list.length
        ? list.map(podRow).join("")
        : q
          ? `<div class="empty">No results.</div>`
          : `<div class="empty"><b>No podcasts yet.</b>Add an RSS feed or an Apple Podcasts link.</div>`);
    const ready = eps.filter((e) => e.status === "ready");
    $("#hmeta").textContent = pods.length
      ? `${pods.length} podcast${pods.length > 1 ? "s" : ""} · ${ready.length} episode${ready.length !== 1 ? "s" : ""} in the cloud · ${fmtSize(ready.reduce((s, e) => s + (e.size || 0), 0))}`
      : "Podcasts";
  }

  $("#list").innerHTML = html;
  $("#dlAll").hidden = true;
}

function playEp(id) {
  const e = epById(id);
  if (!e || e.status !== "ready") return;
  // The queue is this show's stored episodes, in the order on screen, so
  // "next" walks down the list the finger just came from.
  queue = eps.filter((x) => x.pod === e.pod && x.status === "ready").map((x) => x.id);
  qi = queue.indexOf(id);
  queueSrc = e.artist;
  play(id);
}

async function fetchEp(id) {
  const e = epById(id);
  if (!e) return;
  e.status = "queued";
  renderList();
  toast("Fetching to the cloud…");
  await api(`/api/episodes/${id}/fetch`, { method: "POST" }).catch(() => {});
  loadPods();
}

/* -- show menu -- */
let podMenuId = null;
function openPodMenu(id) {
  const p = pods.find((x) => x.id === id);
  if (!p) return;
  podMenuId = id;
  const n = eps.filter((e) => e.pod === id).length;
  $("#pmTtl").textContent = p.title;
  $("#pmSub").textContent = `${p.author || "—"} · ${n} episode${n !== 1 ? "s" : ""} · keeps ${p.keep ?? 5} in the cloud`;
  openSheet("#podMenu");
}

$("#podMenu").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-pa]");
  if (!b || !podMenuId) return;
  const id = podMenuId;
  closeSheets();

  if (b.dataset.pa === "refresh") {
    toast("Checking the feed…");
    const res = await api(`/api/podcasts/${id}/refresh`, { method: "POST" }).catch(() => null);
    const d = res && res.ok ? await res.json().catch(() => ({})) : {};
    toast(d.added ? `${d.added} new episode${d.added > 1 ? "s" : ""}` : "Nothing new");
    loadPods();
  }

  if (b.dataset.pa === "unsub") {
    const cur = byId(queue[qi]);
    if (cur && cur.pod === id) {
      audio.pause(); audio.removeAttribute("src");
      qi = -1; queue = [];
      $("#mini").classList.remove("up");
    }
    for (const ep of eps.filter((x) => x.pod === id)) {
      dropOffline(ep.id).catch(() => {});
      clearPos(ep.id);
    }
    await api(`/api/podcasts/${id}`, { method: "DELETE" }).catch(() => {});
    pods = pods.filter((p) => p.id !== id);
    eps = eps.filter((x) => x.pod !== id);
    if (curPod === id) curPod = null;
    toast("Unsubscribed");
    renderList(); renderNow();
  }
});

/* -- episode menu -- */
let epMenuId = null;
function openEpMenu(id) {
  const ep = epById(id);
  if (!ep) return;
  epMenuId = id;
  const ready = ep.status === "ready";
  $("#emTtl").textContent = ep.title;
  $("#emSub").textContent = ready
    ? `${ep.artist} · ${mmss(ep.duration)} · ${fmtSize(ep.size)}`
    : ep.status === "error" ? (ep.error || "Failed") : `${ep.artist} · not in the cloud yet`;
  $("#emPlay").hidden = !ready;
  $("#emFetch").hidden = ep.status !== "new" && ep.status !== "error";
  $("#emFetchTxt").textContent = ep.status === "error" ? "Retry the fetch" : "Fetch to the cloud";
  $("#emDl").hidden = !ready;
  $("#emDlTxt").textContent = offline.has(id) ? "Remove from device" : "Download to device";
  $("#emCloud").hidden = !ready;
  $("#emMarkTxt").textContent = ep.played ? "Mark as unfinished" : "Mark as finished";
  openSheet("#epMenu");
}

$("#epMenu").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ea]");
  if (!b || !epMenuId) return;
  const id = epMenuId;
  const ep = epById(id);
  closeSheets();
  if (!ep) return;
  const a = b.dataset.ea;

  if (a === "play") playEp(id);
  if (a === "fetch") fetchEp(id);
  if (a === "dl") toggleOffline(id);

  if (a === "cloud") {
    if (queue[qi] === id) {
      audio.pause(); audio.removeAttribute("src");
      qi = -1; queue = [];
      $("#mini").classList.remove("up");
    }
    dropOffline(id).catch(() => {});
    await api(`/api/episodes/${id}`, { method: "DELETE" }).catch(() => {});
    ep.status = "new"; ep.size = 0;
    toast("Removed from the cloud");
    renderList();
  }

  if (a === "mark") {
    ep.played = ep.played ? 0 : 1;
    if (ep.played) { clearPos(id); ep.position = 0; }
    pushEpState(id, ep.played ? { played: 1, position: 0 } : { played: 0 }, true);
    toast(ep.played ? "Marked as finished" : "Marked as unfinished");
    renderList();
  }
});

/* -- subscribing -- */
$("#podPaste").addEventListener("click", async () => {
  try { $("#podUrl").value = (await navigator.clipboard.readText()).trim(); }
  catch { toast("Clipboard not available"); }
});
$("#podUrl").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#podGo").click(); });

$("#podGo").addEventListener("click", async () => {
  const url = $("#podUrl").value.trim();
  if (!url) return;
  const err = $("#podErr");
  err.classList.remove("show");
  const btn = $("#podGo");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>Subscribing…`;
  let res = null;
  try {
    res = await api("/api/podcasts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
  } catch {}
  btn.disabled = false;
  btn.textContent = "Subscribe";
  if (!res || !res.ok) {
    const d = res ? await res.json().catch(() => ({})) : {};
    err.textContent = d.error || "Could not subscribe — is that a feed URL?";
    err.classList.add("show");
    return;
  }
  $("#podUrl").value = "";
  closeSheets();
  toast("Subscribed — fetching the latest episode…");
  loadPods();
});

$("#podBtn").addEventListener("click", () => {
  podMode = !podMode;
  localStorage.setItem("dmzs_podmode", podMode ? "1" : "0");
  curPod = null;
  if (podMode) clearLibraryFilters();
  renderPodPill();
  renderList();
  if (podMode) loadPods();
});

/* ═══ init ═════════════════════════════════════════════════ */
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("visibilitychange", () => {
  // Backgrounded is where an iOS app gets killed without warning, so the
  // position is written before the tab goes quiet rather than after.
  if (document.visibilityState === "visible") { load(); loadPods(); }
  else savePos(true);
});

(async function init() {
  // Ask for persistent storage: on an app pinned to the home screen, iOS
  // grants it without prompting.
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {}

  renderSort();
  measureScrollbar();
  // A device that was left in podcast mode before the line above existed can
  // still hold a latched filter from that session; clear it before drawing.
  if (podMode) clearLibraryFilters();
  renderFav();
  renderMix();
  renderPodPill();
  repeat = Number(localStorage.getItem("dmzs_repeat")) || 0;
  await refreshOffline();
  await load();
  loadPods();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
